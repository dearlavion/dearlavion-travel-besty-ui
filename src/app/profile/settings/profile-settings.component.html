<div class="settings-head">
  <p class="eyebrow">Settings</p>
  <h1 class="settings-title">Your Profile</h1>
  <p class="settings-sub">Update your display info and account email.</p>
</div>

<form class="settings-form" (ngSubmit)="save()">
  <label class="field">
    <span>Username</span>
    <input type="text" [value]="username()" disabled />
    <small class="field-hint">Your account username can't be changed.</small>
  </label>

  <label class="field">
    <span>Email</span>
    <input
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      name="email"
      placeholder="you@example.com"
      required
    />
    <small class="field-hint">Used to log in and for "Email my kit".</small>
  </label>

  <div class="field">
    <span>Avatar</span>
    <div class="avatar-options">
      @for (avatar of avatarOptions; track avatar) {
        <button
          type="button"
          class="avatar-option"
          [class.selected]="selectedAvatar() === avatar"
          (click)="selectedAvatar.set(avatar)"
          [attr.aria-label]="'Choose avatar ' + avatar"
        >
          {{ avatar }}
        </button>
      }
    </div>
  </div>

  <label class="field">
    <span>Currency</span>
    <select
      class="currency-select"
      [ngModel]="selectedCurrency()"
      (ngModelChange)="selectedCurrency.set($event)"
      name="currency"
    >
      @for (option of currencyOptions; track option.code) {
        <option [value]="option.code">{{ option.label }}</option>
      }
    </select>
    <small class="field-hint">Prices and payments will use this currency. Default is USD.</small>
  </label>

  <div class="form-actions">
    <button type="submit" class="save-btn" [disabled]="savingEmail()">
      {{ savingEmail() ? 'Saving…' : 'Save Changes' }}
    </button>
  </div>
</form>
