<header class="admin-bar">
  <div class="admin-wrap">
    <div class="admin-logo"><span class="mark">🌷</span>Travel Besty Admin</div>
    <a routerLink="/" class="back-link">← Back to Storefront</a>
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="admin-nav"
      aria-label="Toggle menu"
    >
      <span class="menu-icon" [class.open]="mobileMenuOpen()">
        <span></span><span></span><span></span>
      </span>
    </button>
  </div>
</header>

<div class="admin-page">
  <aside class="admin-sidebar">
    <nav class="admin-nav" id="admin-nav" [class.open]="mobileMenuOpen()">
      <a routerLink="/" class="admin-nav-link mobile-back-link">
        <span class="admin-nav-icon">←</span>
        Back to Storefront
      </a>
      <a routerLink="/admin/products" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">🛍️</span>
        Products
      </a>
      <a routerLink="/admin/popular-kits" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">🧳</span>
        Popular Kits
      </a>
      <a routerLink="/admin/inventory" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">📦</span>
        Inventory
      </a>
      <a routerLink="/admin/payments" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">💳</span>
        Payments
      </a>
      <a routerLink="/admin/orders" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">🧾</span>
        Orders
      </a>
      <a routerLink="/admin/statistics" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">📊</span>
        Statistics
      </a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/users" routerLinkActive="active" class="admin-nav-link">
          <span class="admin-nav-icon">👤</span>
          Users
        </a>
        <a routerLink="/admin/kit-settings" routerLinkActive="active" class="admin-nav-link">
          <span class="admin-nav-icon">🎒</span>
          Kit Settings
        </a>
      }
      <a routerLink="/admin/settings" routerLinkActive="active" class="admin-nav-link">
        <span class="admin-nav-icon">⚙️</span>
        Settings
      </a>
    </nav>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
