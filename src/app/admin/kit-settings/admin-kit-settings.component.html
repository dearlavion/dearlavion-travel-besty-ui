<div class="settings-head">
  <h1 class="settings-title">Kit Settings</h1>
  <p class="settings-sub">
    Which collections the survey asks about, and which ones a product can be tagged with — two
    separate lists, because the same collection can behave differently in each. Add, rename or
    remove the collections themselves in <a routerLink="/admin/master-data">Master Data</a>.
  </p>
</div>

<app-kit-settings-table
  eyebrow="Storefront · /travel"
  title="Kit builder questionnaire"
  blurb="The questions /travel asks, in order. Positions apply to the whole list; saving writes them all at once."
  itemNoun="question"
  [allCollections]="masterData.collections()"
  [order]="masterData.typeOrder()"
  [settings]="masterData.sectionSettings()"
  [descriptions]="descriptions"
  [valueCounts]="valueCounts()"
  (save)="saveSurvey($event)"
  (addCollection)="addToSurvey($event)"
  (removeCollection)="removeFromSurvey($event)"
/>

<app-kit-settings-table
  eyebrow="Admin · product form"
  title="Product form fields"
  blurb="What the admin product form shows. 'Multiple' here means the product may hold several values — a product can suit both short and long trips even though a shopper picks one."
  itemNoun="field"
  [allCollections]="masterData.collections()"
  [order]="masterData.productFormOrder()"
  [settings]="masterData.productFormSettings()"
  [descriptions]="descriptions"
  [valueCounts]="valueCounts()"
  (save)="saveProductForm($event)"
  (addCollection)="addToProductForm($event)"
  (removeCollection)="removeFromProductForm($event)"
/>
