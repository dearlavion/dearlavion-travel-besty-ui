<div class="image-upload-field">
  <input
    type="text"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onTextChange($any($event.target).value)"
    [disabled]="uploading()"
  />
  <label
    class="upload-btn"
    [class.disabled]="uploading()"
    [class.uploading]="uploading()"
    [title]="uploadLabel()"
    [attr.aria-label]="uploadLabel()"
  >
    <span aria-hidden="true">⬆️</span>
    <input type="file" accept="image/*" (change)="onFileSelected($event)" [disabled]="uploading()" hidden />
  </label>
  @if (pendingFileName() && !uploading()) {
    <p class="pending-hint">📎 {{ pendingFileName() }} — uploads when you save</p>
  }
</div>
