<div class="overlay-backdrop" (click)="onBackdropClick($event)">
  <div class="overlay-card">
    <button type="button" class="close-btn" aria-label="Close" (click)="skip()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 6l12 12M18 6L6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <p class="overlay-eyebrow">🌷 Before you go</p>
    <h2 class="overlay-title">Want more travel tips?</h2>
    <p class="overlay-sub">
      Get occasional new kit ideas and packing guides from Travel Besty. Totally optional — your
      PDF downloads either way.
    </p>

    <form class="subscribe-form" (ngSubmit)="confirmSubscribe()">
      <input
        type="email"
        class="subscribe-input"
        placeholder="you@example.com"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
      />
      <button type="submit" class="subscribe-btn">Subscribe & Download</button>
    </form>

    <button type="button" class="skip-link" (click)="skip()">No thanks, just download</button>
  </div>
</div>
