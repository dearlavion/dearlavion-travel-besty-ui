name: Deploy Travel Besty UI to DEV

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build-and-deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEARLAVION_PAT }}

      # The image builds `--configuration production`, which bakes in the public backend URLs from
      # src/environments/environment.prod.ts. A broken build fails this step (the CI gate).
      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t ghcr.io/dearlavion/dearlavion-travel-besty-ui:dev \
            .

      - name: Checkout Ansible repo
        uses: actions/checkout@v4
        with:
          repository: dearlavion/dearlavion-projects
          path: dearlavion-projects
          token: ${{ secrets.DEARLAVION_PAT }}

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m pip install --user ansible docker
          export PATH=$HOME/.local/bin:$PATH

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 157.173.97.37 >> ~/.ssh/known_hosts

      - name: Deploy Travel Besty UI
        working-directory: dearlavion-projects/ansible
        run: |
          export PATH=$HOME/.local/bin:$PATH
          ansible-playbook \
            playbook/site.yml \
            -i inventory/hosts.ini \
            -e "target=travel-besty-ui env=dev ssh_user=baish ssh_host=157.173.97.37 use_registry=true ghcr_pat=${{ secrets.DEARLAVION_PAT }}" \
            --ssh-extra-args="-o StrictHostKeyChecking=no"
